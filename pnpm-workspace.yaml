packages:
    - ./packages/*
    - ./plugins/*
    - ./tests/*
    - ./tests/plugins/*
    - ./examples/*
    - ./templates/*
    - ./benchmarks/*

catalogs:
    dep:
        es-toolkit: ^1.40.0
        fdir: ^6.5.0
        ts-vista: ~0.2.3
        # postcss
        postcss-flexbugs-fixes: ^5.0.0
        postcss-load-config: ^6.0.0
        postcss-preset-env: ^11.2.0
        # oxc
        oxc-parser: ~0.119.0
        oxc-minify: ~0.119.0
        rolldown: 1.0.0-rc.9
        # tsdown
        "@tsdown/css": ~0.21.3
        tsdown: ~0.21.3
        # vite
        vitest: ^4.0.18
        vite-tsconfig-paths: ^6.1.0
        # react
        "@types/react": ^19.2.14
        "@types/react-dom": ^19.2.0
        react: ^19.2.0
        react-dom: ^19.2.0
        # next
        next: 16.1.6
    dev:
        # unplugin
        webpack: 5.76.0
        rollup: 4.40.0
        rolldown: 1.0.0-rc.9
        vite: 7.0.0
        # rsbuild
        "@rsbuild/core": 1.5.0
        # next
        next: 16.0.0
        # postcss
        postcss: 8.5.0
    peer:
        # webpack
        webpack: ^5.76.0
        rollup: ^4.40.0
        rolldown: 1.0.0-rc.9
        vite: ^7.0.0 || ^8.0.0
        # rsbuild
        "@rsbuild/core": ^1.5.0
        # next
        next: ^15.0.0 || ^16.0.0
        # postcss
        postcss: ^8.5.0

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
    # config
    - "@apst/biome"
    - "@apst/tsconfig"
    - "@apst/tsdown"
    # core
    - "ts-vista"
    # tsdown
    - "@tsdown/*"
    - "tsdown"
